<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .machine-body { fill: #1a1a1a; stroke: #333; stroke-width: 0.5; }
      .machine-accent { fill: #0066ff; }
      .machine-metal { fill: #c0c0c0; }
    </style>
  </defs>
  
  <!-- Фон -->
  <rect width="64" height="64" fill="#ffffff"/>
  
  <!-- Основной корпус -->
  <rect class="machine-body" x="12" y="10" width="40" height="42" rx="3"/>
  
  <!-- Верхняя панель -->
  <rect class="machine-body" x="12" y="10" width="40" height="6" rx="3"/>
  
  <!-- Дисплей -->
  <rect x="14" y="12" width="20" height="4" rx="1" fill="#0a0a0a" stroke="#0066ff" stroke-width="0.5"/>
  
  <!-- Индикаторы -->
  <circle cx="17" cy="14" r="0.8" fill="#0066ff"/>
  <circle cx="20" cy="14" r="0.8" fill="#0066ff" opacity="0.6"/>
  <circle cx="23" cy="14" r="0.8" fill="#0066ff" opacity="0.3"/>
  
  <!-- Кнопки на панели -->
  <circle cx="35" cy="12.5" r="1" class="machine-metal" stroke="#666" stroke-width="0.3"/>
  <circle cx="40" cy="12.5" r="1" class="machine-metal" stroke="#666" stroke-width="0.3"/>
  <circle cx="45" cy="12.5" r="1" class="machine-metal" stroke="#666" stroke-width="0.3"/>
  
  <!-- Рабочая зона (групповая часть) -->
  <rect x="14" y="20" width="36" height="20" rx="2" fill="#222" stroke="#333" stroke-width="0.5"/>
  
  <!-- Две групповые головки -->
  <!-- Левая -->
  <circle cx="20" cy="28" r="4" class="machine-metal" stroke="#666" stroke-width="0.5"/>
  <circle cx="20" cy="28" r="2.5" fill="#0a0a0a"/>
  <circle cx="20" cy="28" r="1.5" class="machine-accent" opacity="0.5"/>
  <rect x="18" y="32" width="4" height="6" rx="0.5" fill="#333" stroke="#555" stroke-width="0.3"/>
  
  <!-- Правая -->
  <circle cx="44" cy="28" r="4" class="machine-metal" stroke="#666" stroke-width="0.5"/>
  <circle cx="44" cy="28" r="2.5" fill="#0a0a0a"/>
  <circle cx="44" cy="28" r="1.5" class="machine-accent" opacity="0.5"/>
  <rect x="42" y="32" width="4" height="6" rx="0.5" fill="#333" stroke="#555" stroke-width="0.3"/>
  
  <!-- Нижняя часть (поддон) -->
  <rect class="machine-body" x="12" y="50" width="40" height="4" rx="2"/>
  
  <!-- Блик света -->
  <ellipse cx="32" cy="15" rx="8" ry="2" fill="#fff" opacity="0.1"/>
  
  <!-- Логотип BREW.TECH (внизу) -->
  <text x="32" y="60" font-family="Arial, sans-serif" font-size="3" font-weight="bold" text-anchor="middle" fill="#0066ff">BT</text>
</svg>
