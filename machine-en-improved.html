<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Espresso — BREW.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box}
        body {font-family:'Montserrat',sans-serif; background:#f8f9fa}
        .hero {background:linear-gradient(135deg,#0a0a0a,#1a1a1a); color:#fff; padding:100px 40px; text-align:center}
        .hero h1 {font-size:48px; font-weight:900; margin-bottom:15px}
        .hero p {font-size:18px; opacity:.85}
        .hero .price {font-size:40px; font-weight:900; margin:25px 0; color:#0066ff}
        .product {max-width:1200px; margin:-100px auto 0; padding:0 40px; position:relative; z-index:1}
        .product img {width:100%; border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.25)}
        .specs {display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:20px; margin:60px 40px}
        .spec {background:#fff; padding:20px; border-radius:12px; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.08)}
        .spec h3 {font-size:11px; color:#0066ff; font-weight:700; margin-bottom:8px}
        .spec p {font-size:20px; font-weight:900}
    </style>
</head>
<body>
<div class="hero">
    <h1>Pro Espresso</h1>
    <p>Professional Dual-Group Machine</p>
    <div class="price">489,000 RUB</div>
</div>

<div class="product">
    <img src="machine.png" alt="Pro Espresso" loading="lazy">
</div>

<div class="specs">
    <div class="spec"><h3>GROUPS</h3><p>2</p></div>
    <div class="spec"><h3>TEMP</h3><p>±0.2°C</p></div>
    <div class="spec"><h3>PRESSURE</h3><p>9.0 BAR</p></div>
    <div class="spec"><h3>BOILER</h3><p>10L</p></div>
</div>
</body>
</html>
