<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#505050;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="700" fill="#f8f9fa"/>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="620" rx="200" ry="30" fill="#000000" opacity="0.1"/>
  
  <!-- ESPRESSO MACHINE -->
  <g filter="url(#shadow)">
    <!-- Base/Platform -->
    <rect x="100" y="500" width="400" height="50" rx="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="100" y="500" width="400" height="8" fill="#0099ff" opacity="0.3"/>
    
    <!-- Body Main -->
    <path d="M 120 500 L 130 200 Q 300 180 470 200 L 480 500 Z" fill="url(#metal)" stroke="#606060" stroke-width="2"/>
    
    <!-- Front Dark Panel -->
    <path d="M 140 250 Q 300 240 460 250 L 455 480 Q 300 490 145 480 Z" fill="#1a1a1a" opacity="0.7" stroke="#0099ff" stroke-width="1"/>
    
    <!-- Top Reservoir -->
    <ellipse cx="300" cy="200" rx="140" ry="50" fill="#e6f2ff" stroke="#0099ff" stroke-width="2"/>
    <ellipse cx="300" cy="200" rx="135" ry="45" fill="#f0f8ff" opacity="0.6"/>
    <text x="300" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0055cc" text-anchor="middle" opacity="0.8">10L WATER TANK</text>
    
    <!-- Display Screen -->
    <rect x="160" y="270" width="280" height="90" rx="8" fill="#001a40" stroke="#0099ff" stroke-width="2"/>
    <rect x="165" y="275" width="270" height="80" rx="6" fill="#0d2847"/>
    
    <!-- Display text -->
    <text x="300" y="305" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#00ccff" text-anchor="middle">93.5°C</text>
    <text x="300" y="335" font-family="'JetBrains Mono', monospace" font-size="18" fill="#0099ff" text-anchor="middle">9.0 BAR • PID</text>
    
    <!-- Left Group Head -->
    <g>
      <circle cx="200" cy="380" r="32" fill="url(#metal)" stroke="#505050" stroke-width="2"/>
      <circle cx="200" cy="380" r="28" fill="#3a3a3a"/>
      <circle cx="200" cy="380" r="22" fill="#1a1a1a"/>
      <!-- Portafilter hole -->
      <circle cx="200" cy="380" r="15" fill="#000000" opacity="0.8"/>
    </g>
    
    <!-- Right Group Head -->
    <g>
      <circle cx="400" cy="380" r="32" fill="url(#metal)" stroke="#505050" stroke-width="2"/>
      <circle cx="400" cy="380" r="28" fill="#3a3a3a"/>
      <circle cx="400" cy="380" r="22" fill="#1a1a1a"/>
      <!-- Portafilter hole -->
      <circle cx="400" cy="380" r="15" fill="#000000" opacity="0.8"/>
    </g>
    
    <!-- Spout/Dispenser -->
    <g>
      <path d="M 270 430 L 330 430 L 335 470 L 265 470 Z" fill="url(#metal)" stroke="#505050" stroke-width="1"/>
      <rect x="280" y="460" width="40" height="30" fill="#1a1a1a" rx="3"/>
    </g>
    
    <!-- Cup Rest Platform -->
    <rect x="150" y="470" width="300" height="15" fill="#404040" stroke="#202020" stroke-width="1" rx="2"/>
    <line x1="150" y1="475" x2="450" y2="475" stroke="#606060" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Side Details - Control Knobs -->
    <circle cx="160" cy="340" r="12" fill="url(#metal)" stroke="#505050" stroke-width="1"/>
    <line x1="160" y1="330" x2="160" y2="318" stroke="#1a1a1a" stroke-width="2"/>
    
    <circle cx="440" cy="340" r="12" fill="url(#metal)" stroke="#505050" stroke-width="1"/>
    <line x1="440" y1="330" x2="440" y2="318" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Accent Line -->
    <line x1="120" y1="215" x2="480" y2="215" stroke="url(#blue)" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- MODEL INFO -->
  <text x="300" y="580" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#0a0a0a" text-anchor="middle">Pro Espresso</text>
  <text x="300" y="605" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Model BT-PRO/01 • 2 Group Heads • PID ±0.2°C</text>
  <text x="300" y="630" font-family="Arial, sans-serif" font-size="13" fill="#0099ff" text-anchor="middle">★ Профессиональное оборудование • Professional Coffee Machine</text>
</svg>
