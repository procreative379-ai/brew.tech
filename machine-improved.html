<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Espresso — BREW.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box}
        body {font-family:'Montserrat',sans-serif; background:#f8f9fa}
        .hero {background:linear-gradient(135deg,#0a0a0a,#1a1a1a); color:#fff; padding:100px 40px; text-align:center}
        .hero h1 {font-size:48px; font-weight:900; margin-bottom:15px}
        .hero p {font-size:18px; opacity:.85}
        .hero .price {font-size:40px; font-weight:900; margin:25px 0; color:#0066ff}
        .product {max-width:1200px; margin:-100px auto 0; padding:0 40px; position:relative; z-index:1}
        .product img {width:100%; border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.25)}
        .specs {display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin:60px 40px; padding:0}
        .spec {background:#fff; padding:25px; border-radius:12px; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.08)}
        .spec h3 {font-size:12px; color:#0066ff; font-weight:700; margin-bottom:10px; text-transform:uppercase}
        .spec p {font-size:24px; font-weight:900; color:#0a0a0a}
        @media(max-width:768px) {.product img {width:100%}; .specs {grid-template-columns:repeat(2,1fr); margin:40px 20px}}
    </style>
</head>
<body>
<div class="hero">
    <h1>Pro Espresso</h1>
    <p>Двухгруппная профессиональная кофемашина</p>
    <div class="price">489 000 ₽</div>
</div>

<div class="product">
    <img src="machine.png" alt="Pro Espresso" loading="lazy">
</div>

<div class="specs">
    <div class="spec"><h3>Групп</h3><p>2</p></div>
    <div class="spec"><h3>Температура</h3><p>±0.2°C</p></div>
    <div class="spec"><h3>Давление</h3><p>9.0 БАР</p></div>
    <div class="spec"><h3>Котел</h3><p>10L</p></div>
    <div class="spec"><h3>Питание</h3><p>380В</p></div>
    <div class="spec"><h3>Гарантия</h3><p>12 мес</p></div>
</div>
</body>
</html>
