<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pro Grinder - professional coffee grinder by BREW.TECH">
    <title>Pro Grinder — BREW.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box}
        body {font-family:'Montserrat',sans-serif; background:#f8f9fa}
        .hero {background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%); color:#fff; padding:80px 40px; text-align:center}
        .hero h1 {font-size:clamp(32px,6vw,56px); font-weight:900; margin-bottom:20px}
        .hero p {font-size:18px; opacity:.85}
        .hero .price {font-size:36px; font-weight:900; margin:30px 0}
        .hero .cta {display:flex; gap:15px; margin-top:30px; justify-content:center; flex-wrap:wrap}
        .btn {padding:14px 32px; font-weight:700; border:none; border-radius:8px; cursor:pointer; transition:all.3s}
        .btn-primary {background:#0066ff; color:#fff}
        .btn-primary:hover {background:#0052cc; transform:translateY(-2px)}
        .product {max-width:1440px; margin:0 auto; padding:80px 40px}
        .product img {width:100%; max-width:600px; margin:0 auto; display:block; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15)}
        .specs {display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:30px; margin-top:80px}
        .spec {background:#fff; padding:25px; border-radius:12px; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.08)}
        .spec h3 {font-size:12px; color:#0066ff; font-weight:600; margin-bottom:8px}
        .spec p {font-size:18px; font-weight:900}
        @media(max-width:768px) {.hero {padding:50px 20px}; .product {padding:40px 20px}}
    </style>
</head>
<body>
<div class="hero">
    <h1>Pro Grinder</h1>
    <p>Professional Coffee Grinder</p>
    <p>75mm Flat Burrs • Weight-Based Dosing • 500 Grind Settings</p>
    <div class="price">189,000 RUB</div>
    <div class="cta">
        <button class="btn btn-primary">Request Demo</button>
    </div>
</div>

<div class="product">
    <img src="grinder.png" alt="Pro Grinder" loading="lazy">
    <div class="specs">
        <div class="spec"><h3>BURRS</h3><p>75mm</p></div>
        <div class="spec"><h3>SETTINGS</h3><p>500</p></div>
        <div class="spec"><h3>HOPPER</h3><p>500g</p></div>
        <div class="spec"><h3>NOISE</h3><p>78dB</p></div>
    </div>
</div>
</body>
</html>
