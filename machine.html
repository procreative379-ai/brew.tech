<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pro Espresso - двухгруппная профессиональная кофемашина BREW.TECH.">
    <meta name="keywords" content="кофемашина, эспрессо, Pro Espresso, BREW.TECH">
    <meta name="robots" content="index, follow">
    <title>Pro Espresso — BREW.TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {margin:0; padding:0; box-sizing:border-box}
        body {font-family:'Montserrat',sans-serif; background:#f8f9fa; color:#0a0a0a}
        .hero {background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%); color:#fff; padding:80px 40px; text-align:center}
        .hero h1 {font-size:clamp(32px,6vw,56px); font-weight:900; margin-bottom:20px}
        .hero p {font-size:18px; opacity:.85; margin-bottom:10px}
        .hero .price {font-size:36px; font-weight:900; margin:30px 0}
        .hero .cta {display:inline-flex; gap:15px; margin-top:30px; flex-wrap:wrap; justify-content:center}
        .btn {padding:14px 32px; font-weight:700; border:none; border-radius:8px; cursor:pointer; transition:all.3s}
        .btn-primary {background:#0066ff; color:#fff}
        .btn-primary:hover {background:#0052cc; transform:translateY(-2px); box-shadow:0 8px 16px rgba(0,102,255,.3)}
        .btn-secondary {background:rgba(255,255,255,.1); color:#fff; border:2px solid rgba(255,255,255,.3)}
        .btn-secondary:hover {background:rgba(255,255,255,.2)}
        
        .product {max-width:1440px; margin:0 auto; padding:80px 40px}
        .product img {width:100%; max-width:800px; margin:0 auto; display:block; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15)}
        
        .specs {display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:30px; margin-top:80px}
        .spec {background:#fff; padding:30px; border-radius:12px; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.08)}
        .spec h3 {font-size:14px; color:#0066ff; font-weight:600; margin-bottom:10px}
        .spec p {font-size:20px; font-weight:900; color:#0a0a0a}
        
        footer {text-align:center; padding:40px; border-top:1px solid #e0e0e0; margin-top:80px}
        footer a {color:#0066ff; margin:0 15px; text-decoration:none; font-size:13px}
        footer a:hover {text-decoration:underline}
        
        @media(max-width:768px) {.hero {padding:50px 20px}; .product {padding:40px 20px}; .specs {grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="hero">
    <h1>Pro Espresso</h1>
    <p>Двухгруппная профессиональная кофемашина</p>
    <p>PID контроль ±0.2°C • 9.0 БАР • 10L котел</p>
    <div class="price">489 000 ₽</div>
    <div class="cta">
        <button class="btn btn-primary">Запросить демо</button>
        <button class="btn btn-secondary">Характеристики</button>
    </div>
</div>

<div class="product">
    <img src="machine.png" alt="Pro Espresso кофемашина" loading="lazy">
    
    <div class="specs">
        <div class="spec"><h3>ГРУПП</h3><p>2</p></div>
        <div class="spec"><h3>ТЕМПЕРАТУРА</h3><p>±0.2°C</p></div>
        <div class="spec"><h3>ДАВЛЕНИЕ</h3><p>9.0 БАР</p></div>
        <div class="spec"><h3>КОТЕЛ</h3><p>10L</p></div>
        <div class="spec"><h3>ПИТАНИЕ</h3><p>380В 4.8кВт</p></div>
        <div class="spec"><h3>ГАРАНТИЯ</h3><p>12 мес</p></div>
    </div>
</div>

<footer>
    <a href="index.html">На главную</a>
    <a href="grinder.html">Кофемолка</a>
    <a href="privacy.html">Политика</a>
</footer>

<script src="partials.js"></script>
</body>
</html>
