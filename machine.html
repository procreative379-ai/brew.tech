<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Espresso - BREW.TECH</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box}
        html, body {height:100%; width:100%}
        body {font-family: Arial, sans-serif; background: #f5f5f5; color: #333}
        
        header {background: white; padding: 20px 40px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center}
        header h1 {font-size: 28px; font-weight: bold}
        header nav a {margin: 0 20px; text-decoration: none; color: #333; font-weight: 500}
        header nav a:hover {color: #0066ff}
        header button {background: black; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer}
        
        .hero {background: linear-gradient(135deg, #1a1a1a 0%, #333 100%); color: white; padding: 60px 40px; text-align: center}
        .hero h2 {font-size: 48px; margin-bottom: 20px}
        .hero p {font-size: 18px; margin-bottom: 10px; opacity: 0.9}
        .price {font-size: 36px; font-weight: bold; margin: 30px 0; color: #0066ff}
        .hero button {background: #0066ff; color: white; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold}
        .hero button:hover {background: #0052cc}
        
        .product-section {max-width: 1200px; margin: 0 auto; padding: 60px 40px}
        .product-img {width: 100%; max-width: 600px; margin: 0 auto 40px; display: block; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1)}
        
        .specs-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 40px}
        .spec-card {background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05)}
        .spec-card h4 {color: #0066ff; font-size: 12px; margin-bottom: 10px; font-weight: bold}
        .spec-card p {font-size: 20px; font-weight: bold}
        
        footer {text-align: center; padding: 20px; color: #666; font-size: 14px}
    </style>
</head>
<body>
<header>
    <h1>BREW.<span style="color: #0066ff">TECH</span></h1>
    <nav>
        <a href="index.html">Главная</a>
        <a href="machine.html">Машина</a>
        <a href="grinder.html">Молка</a>
    </nav>
    <button>Запросить демо</button>
</header>

<div class="hero">
    <h2>Pro Espresso</h2>
    <p>Двухгруппная профессиональная кофемашина</p>
    <p>PID контроль ±0.2°C • 9.0 БАР • 10L котел</p>
    <div class="price">489 000 ₽</div>
    <button>Запросить демо</button>
</div>

<div class="product-section">
    <img src="machine.png" alt="Pro Espresso" class="product-img">
    
    <div class="specs-grid">
        <div class="spec-card"><h4>ГРУПП</h4><p>2</p></div>
        <div class="spec-card"><h4>ТЕМПЕРАТУРА</h4><p>±0.2°C</p></div>
        <div class="spec-card"><h4>ДАВЛЕНИЕ</h4><p>9.0 БАР</p></div>
        <div class="spec-card"><h4>КОТЕЛ</h4><p>10L</p></div>
        <div class="spec-card"><h4>ПИТАНИЕ</h4><p>380В</p></div>
        <div class="spec-card"><h4>ГАРАНТИЯ</h4><p>12 мес</p></div>
    </div>
</div>

<footer>© 2026 BREW.TECH</footer>
</body>
</html>
