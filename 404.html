<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Страница не найдена · BREW.TECH</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= BREW.TECH — shared styles ================= */
:root{
  --black:#000;
  --ink:#0a0a0a;
  --blue:#0066ff;
  --blue-soft:rgba(0,102,255,.08);
  --orange:#ff6b35;
  --white:#fff;
  --bg:#f5f5f5;
  --line:rgba(0,0,0,.08);
  --line-d:rgba(255,255,255,.08);
  --mute:#6b6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--white);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.container{max-width:1440px;margin:0 auto;padding:0 48px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.eyebrow.light{color:rgba(255,255,255,.6)}
.dot-blue{color:var(--blue)}

/* ================= NAV ================= */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav.dark{background:rgba(10,10,10,.88);border-bottom-color:rgba(255,255,255,.08)}
.nav.dark .nav-links a{color:rgba(255,255,255,.75)}
.nav.dark .nav-links a:hover{color:#fff}
.nav.dark .logo .b{color:#fff}
.nav.dark .nav-cta{background:#fff;color:#000}
.nav.dark .nav-cta::after{border-color:#000}
.nav.dark .mega{background:#0a0a0a;border-color:rgba(255,255,255,.08);color:#fff}
.nav.dark .mega .col h6{color:rgba(255,255,255,.45)}
.nav.dark .mega .product-mini{background:#0e0e0e;border-color:rgba(255,255,255,.08)}
.nav.dark .mega .product-mini:hover{border-color:var(--blue)}
.nav.dark .mega .product-mini h4{color:#fff}
.nav.dark .mega .product-mini p{color:rgba(255,255,255,.55)}
.nav.dark .burger span{background:#fff}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 48px;max-width:1440px;margin:0 auto;gap:24px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.01em;flex-shrink:0;display:inline-flex}
.logo .b{color:#000}
.logo .dot{color:var(--blue)}
.logo .t{color:var(--blue)}
.nav-links{display:flex;gap:30px;align-items:center}
.nav-links > .item{position:relative}
.nav-links a{font-size:13.5px;font-weight:500;color:#333;transition:color .15s;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.nav-links a:hover{color:var(--blue)}
.nav-links a.active{color:var(--blue)}
.has-mega > a::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:4px;margin-top:-3px;transition:transform .2s}
.has-mega:hover > a::after{transform:rotate(-135deg);margin-top:2px}
.nav-right{display:flex;align-items:center;gap:18px}
.nav-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:#000;font-weight:600;letter-spacing:.02em}
.nav.dark .nav-phone{color:#fff}
.nav-cta{display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;padding:11px 18px;border-radius:0;font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.nav-cta::after{content:"";width:10px;height:10px;border-right:1.5px solid #fff;border-top:1.5px solid #fff;transform:rotate(45deg);margin-left:2px}

/* Mega menu */
.mega{position:absolute;top:calc(100% + 0px);left:50%;transform:translateX(-50%) translateY(8px);background:#fff;border:1px solid var(--line);min-width:680px;padding:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;z-index:60;box-shadow:0 24px 48px -16px rgba(0,0,0,.15)}
.has-mega:hover > .mega{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.mega .col h6{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#888;margin-bottom:14px}
.mega .product-mini{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px;transition:border-color .15s, background .15s}
.mega .product-mini:hover{border-color:var(--blue)}
.mega .product-mini .thumb{width:64px;height:64px;background:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mega .product-mini h4{font-weight:700;font-size:15px;letter-spacing:-.005em;margin-bottom:2px}
.mega .product-mini p{font-size:12px;color:#666;line-height:1.4}
.mega .links{display:flex;flex-direction:column;gap:10px}
.mega .links a{font-size:13.5px;color:#444;padding:6px 0}
.mega .links a:hover{color:var(--blue)}
.mega .links a .arr{color:var(--blue);margin-right:6px}

/* Burger / mobile */
.burger{display:none;width:32px;height:32px;background:transparent;border:0;cursor:pointer;flex-direction:column;justify-content:center;gap:5px;padding:6px}
.burger span{display:block;height:2px;background:#000;width:100%;transition:transform .2s, opacity .2s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.mobile-menu{position:fixed;top:68px;left:0;right:0;bottom:0;background:#fff;z-index:49;padding:32px 24px;display:none;overflow-y:auto;flex-direction:column;gap:8px}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:22px;font-weight:600;padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.mobile-menu a .arr{color:var(--blue);font-size:14px}
.mobile-menu .sub{margin:8px 0 16px;padding:0 0 0 16px;border-left:2px solid var(--blue);display:flex;flex-direction:column;gap:14px}
.mobile-menu .sub a{font-size:15px;font-weight:500;color:#555;padding:4px 0;border:0}
.mobile-menu .foot-cta{margin-top:18px;background:var(--blue);color:#fff;padding:18px;text-align:center;font-weight:700;justify-content:center;border:0}

/* ================= COMMON BUTTONS ================= */
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 24px;font-weight:600;font-size:14px;letter-spacing:.02em;border:none;cursor:pointer;transition:transform .15s ease, background .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0052cc}
.btn-ghost{background:transparent;color:#000;border:1.5px solid #000}
.btn-ghost:hover{background:#000;color:#fff}
.btn .arrow{width:14px;height:1.5px;background:currentColor;position:relative}
.btn .arrow::after{content:"";position:absolute;right:-1px;top:-4px;width:9px;height:9px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg)}

/* ================= FOOTER ================= */
footer{background:#000;color:#fff;border-top:1px solid rgba(255,255,255,.08);padding:48px 0 32px}
.foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px;align-items:start}
.foot .logo{font-size:24px;color:#fff;display:inline-flex}
.foot p{margin-top:14px;color:rgba(255,255,255,.5);font-size:13px;line-height:1.55;max-width:280px}
.foot h5{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--blue);margin-bottom:14px}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.foot ul a{color:rgba(255,255,255,.7);font-size:14px}
.foot ul a:hover{color:var(--blue)}
.foot-bot{margin-top:48px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.08em}

/* ================= 404 PAGE ================= */
.error-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 68px);padding-top:100px;text-align:center}
.error-code{font-family:'JetBrains Mono',monospace;font-size:clamp(48px,15vw,180px);font-weight:900;color:var(--blue);line-height:1;margin-bottom:20px;opacity:.85}
.error-title{font-size:clamp(28px,5vw,56px);font-weight:800;margin-bottom:16px;letter-spacing:-.02em;max-width:600px}
.error-desc{font-size:16px;color:var(--mute);max-width:500px;margin-bottom:48px;line-height:1.6}
.error-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:80px}
.error-visual{width:200px;height:200px;margin:0 auto 40px;opacity:.4}

/* ================= RESPONSIVE ================= */
@media (max-width:1100px){
  .nav-links{display:none}
  .nav-phone{display:none}
  .burger{display:flex}
}
@media (max-width:1024px){
  .container,.nav-inner{padding-left:24px;padding-right:24px}
}
@media (max-width:640px){
  .container,.nav-inner{padding-left:16px;padding-right:16px}
  .error-code{font-size:clamp(32px,12vw,80px)}
  .error-title{font-size:clamp(24px,6vw,36px)}
  .error-buttons{flex-direction:column}
  .btn{width:100%}
}
</style>
</head>
<body>

<div id="navMount"></div>

<main class="error-container">

      <circle cx="100" cy="100" r="90" fill="none" stroke="#0066ff" stroke-width="2" opacity=".2"/>
      <g transform="translate(100,100)">
        <circle cx="-25" cy="-30" r="8" fill="#0066ff"/>
        <circle cx="25" cy="-30" r="8" fill="#0066ff"/>
        <path d="M -20 0 Q 0 20 20 0" stroke="#0066ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="error-code">404</div>
  
  <h1 class="error-title">Страница не найдена</h1>

  <div class="error-buttons">

</main>

<div id="footMount"></div>

<script>

            <div class="col">

              <a class="product-mini" href="machine.html">
                <span class="thumb">
                  <svg viewBox="0 0 64 64" width="44" height="44"><rect x="14" y="12" width="36" height="40" rx="3" fill="#1a1a1a" stroke="#333"/><rect x="20" y="18" width="24" height="10" fill="#0066ff" fill-opacity=".4"/><circle cx="24" cy="38" r="3" fill="#0066ff"/><circle cx="40" cy="38" r="3" fill="#0066ff"/><rect x="18" y="46" width="28" height="3" fill="#0066ff"/></svg>
                </span>

              </a>
              <a class="product-mini" href="grinder.html">
                <span class="thumb">
                  <svg viewBox="0 0 64 64" width="44" height="44"><ellipse cx="32" cy="14" rx="18" ry="4" fill="#0a0a0a" stroke="#333"/><rect x="18" y="14" width="28" height="14" fill="#1a1a1a" stroke="#333"/><rect x="22" y="28" width="20" height="26" fill="#1a1a1a" stroke="#333"/><rect x="26" y="34" width="12" height="8" fill="#0066ff" fill-opacity=".4"/><circle cx="32" cy="48" r="3" fill="#0066ff"/></svg>
                </span>
                <div><h4>Pro Grinder</h4><p>Кофемолка с&nbsp;плоскими жерновами · от 189 000 ₽</p></div>
              </a>
            </div>
            <div class="col">
              <h6>// РАЗДЕЛЫ</h6>
              <div class="links">
                <a href="machine.html"><span class="arr">→</span>Кофемашина BT-PRO/01</a>

      </div>

      <div class="nav-right">

        <button class="burger" aria-label="Меню" id="burger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Главная <span class="arr">→</span></a>
    <a data-toggle="prod">Оборудование <span class="arr">+</span></a>
    <div class="sub" id="prod-sub" style="display:none">
      <a href="machine.html">Кофемашина Pro Espresso</a>
      <a href="grinder.html">Кофемолка Pro Grinder</a>
      <a href="index.html#price">Прозрачная цена</a>
    </div>
    <a href="index.html#buy">Где купить <span class="arr">→</span></a>
    <a href="articles.html">Статьи <span class="arr">→</span></a>
    <a href="index.html#platform">Платформа <span class="arr">→</span></a>
    <a href="index.html#mission">О нас <span class="arr">→</span></a>
    <a href="index.html#audience">Кому подходит <span class="arr">→</span></a>
    <a href="tel:+74951234567">+7 495 123-45-67 <span class="arr">→</span></a>
    <a href="index.html#contact" class="foot-cta">Запросить демо</a>
  </div>
  `;

  const footerHTML = `
  <footer data-screen-label="10 Footer">
    <div class="container">
      <div class="foot">
        <div>
          <div class="logo"><span style="color:#fff">BREW</span><span style="color:#0066ff">.</span><span style="color:#0066ff">TECH</span></div>

          </ul>
        </div>
        <div>
          <h5>// КОНТАКТЫ</h5>

            <li><a href="mailto:hello@brew.tech">hello@brew.tech</a></li>

        <span>BUILD 2026.05 · МОСКВА / НИЖНИЙ / КАЗАНЬ</span>
      </div>
    </div>
  </footer>
  `;

  document.getElementById('navMount')?.insertAdjacentHTML('beforebegin', navHTML);
  document.getElementById('navMount')?.remove();
  document.getElementById('footMount')?.insertAdjacentHTML('beforebegin', footerHTML);
  document.getElementById('footMount')?.remove();

  // Burger toggle
  const burger = document.getElementById('burger');
  const menu = document.getElementById('mobileMenu');
  burger?.addEventListener('click', ()=>{
    burger.classList.toggle('open');
    menu.classList.toggle('open');
    document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
  });
  menu?.addEventListener('click', e=>{
    const t = e.target.closest('a');
    if(t && !t.dataset.toggle){
      burger.classList.remove('open');
      menu.classList.remove('open');
      document.body.style.overflow = '';
    }
    if(t && t.dataset.toggle){
      e.preventDefault();
      const sub = document.getElementById(t.dataset.toggle + '-sub');
      sub.style.display = sub.style.display === 'none' ? 'flex' : 'none';
    }
  });

</script>

</body>
